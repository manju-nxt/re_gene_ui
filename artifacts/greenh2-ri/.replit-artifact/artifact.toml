kind = "web"
previewPath = "/"
title = "GreenH2 Nxt — Revenue Intelligence"
version = "1.0.0"
id = "artifacts/greenh2-ri"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24279

[services.development]
run = "pnpm --filter @workspace/greenh2-ri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/greenh2-ri", "run", "build" ]
publicDir = "artifacts/greenh2-ri/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24279"
BASE_PATH = "/"
